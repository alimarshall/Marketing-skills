<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LinkedIn ad concept previews</title>
<!--
  Concept-stage preview renderer.

  Set ADVERTISER to the brand being previewed and edit the CONCEPTS array
  below, open this file in a browser, then screenshot or print to PDF.
  Everything is inline: no build step, no network.

  What it is for:
    - judging a 1200x1200 as a square in a feed, not as a slide in a doc
    - seeing the 150-character truncation and the "see more" fold land live
    - checking the asset survives light and dark mode

  What it is not: a design tool. It will not make a weak layout look good.
  That is deliberate. See references/visualisation.md.

  imageMode:
    'wireframe'  zones drawn from the `zones` array (default, concept stage)
    'image'      renders `imageSrc` (a local file path or data: URL)
-->
<style>
  :root {
    --page-bg: #f4f2ee;
    --card-bg: #ffffff;
    --text: #000000e6;
    --muted: #00000099;
    --line: #00000014;
    --accent: #0a66c2;
    --wire-bg: #eceae5;
    --wire-line: #00000026;
  }
  body.dark {
    --page-bg: #1b1f23;
    --card-bg: #1d2226;
    --text: #ffffffe6;
    --muted: #ffffff99;
    --line: #ffffff1f;
    --accent: #71b7fb;
    --wire-bg: #262b30;
    --wire-line: #ffffff26;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 24px 80px;
    background: var(--page-bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header { max-width: 1200px; margin: 0 auto 28px; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  .meta { font-size: 13px; color: var(--muted); }
  button {
    font: inherit; font-size: 13px; padding: 7px 14px; border-radius: 16px;
    border: 1px solid var(--accent); background: transparent; color: var(--accent);
    cursor: pointer; margin-left: auto;
  }
  button:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }

  .grid {
    max-width: 1200px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 32px;
  }

  .concept { min-width: 0; }
  .label { font-size: 12px; color: var(--muted); margin-bottom: 8px; line-height: 1.5; }
  .label b { color: var(--text); font-weight: 600; }

  .card {
    background: var(--card-bg); border: 1px solid var(--line);
    border-radius: 8px; overflow: hidden;
    box-shadow: 0 0 0 1px #0000000a, 0 2px 4px #00000012;
  }

  .head { display: flex; gap: 8px; padding: 12px 12px 0; align-items: flex-start; }
  .avatar {
    width: 48px; height: 48px; border-radius: 50%; flex: none;
    background: var(--wire-bg); border: 1px solid var(--wire-line);
    display: grid; place-items: center; font-size: 10px; color: var(--muted);
  }
  .who { min-width: 0; }
  .who .name { font-size: 14px; font-weight: 600; line-height: 1.3; }
  .who .sub { font-size: 12px; color: var(--muted); line-height: 1.35; }

  .intro { padding: 8px 12px 12px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
  .intro .rest { display: none; }
  .intro.open .rest { display: inline; }
  .intro.open .seemore { display: none; }
  .seemore { color: var(--muted); cursor: pointer; }
  .seemore:hover { color: var(--accent); text-decoration: underline; }

  .media { background: var(--wire-bg); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); position: relative; }
  .media img { display: block; width: 100%; height: auto; }
  .ratio { position: relative; width: 100%; }
  .zones { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 6%; gap: 4%; }
  .zone {
    flex: 1; border: 1px dashed var(--wire-line); border-radius: 4px;
    padding: 3%; display: flex; flex-direction: column; justify-content: center; gap: 4px;
    min-height: 0;
  }
  .zone .tag { font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .zone .copy { font-size: 15px; font-weight: 650; line-height: 1.25; word-wrap: break-word; }
  .zone.sm .copy { font-size: 11px; font-weight: 400; color: var(--muted); }

  .foot { display: flex; align-items: center; gap: 12px; padding: 10px 12px; }
  .foot .h { font-size: 14px; font-weight: 600; line-height: 1.3; flex: 1; min-width: 0; word-wrap: break-word; }
  .foot .d { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .cta {
    flex: none; font-size: 14px; font-weight: 600; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 16px; padding: 5px 14px; white-space: nowrap;
  }

  .counts { margin-top: 10px; font-size: 11px; line-height: 1.7; color: var(--muted); font-variant-numeric: tabular-nums; }
  .counts .ok { color: #0a7d3f; }
  body.dark .counts .ok { color: #6fcf97; }
  .counts .over { color: #b42318; font-weight: 600; }
  body.dark .counts .over { color: #ff8d85; }

  @media print {
    body { background: #fff; padding: 0; }
    button { display: none; }
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<header>
  <h1>Ad concept previews</h1>
  <span class="meta">Concept stage. Not final design.</span>
  <button onclick="document.body.classList.toggle('dark')">Toggle dark mode</button>
</header>

<div class="grid" id="grid"></div>

<script>
// ---------------------------------------------------------------------------
// EDIT BELOW
// ---------------------------------------------------------------------------

const ADVERTISER = { name: "Your Brand", sub: "Promoted" };

const CONCEPTS = [
  {
    id: "C1",
    label: "Containment · single image · IT / security, product-aware",
    ratio: "1:1",                    // 1:1 | 1.91:1 | 4:5 | 9:16
    imageMode: "wireframe",          // wireframe | image
    // imageSrc: "./renders/c1.png",
    intro: "Every automated action is scoped to a permission you set, and logged against the record it touched.\n\nRead-only to start. Widen the scope when you are ready, one step at a time.",
    headline: "You decide how much the system can do on its own",
    description: "",
    cta: "Learn more",
    zones: [
      { tag: "headline zone, top 20%", copy: "Read-only. Or reversible. Or ask first. You set it." },
      { tag: "diagram zone", copy: "Read-only  ›  Reversible  ›  Notify  ›  Approval required" },
      { tag: "footer + wordmark", copy: "Every action logged against the record.", small: true }
    ]
  },
  {
    id: "C2",
    label: "Data you cannot trust · single image · ops lead, problem-aware",
    ratio: "1:1",
    imageMode: "wireframe",
    intro: "Nine systems to update when one record changes. One of them will be wrong by Friday.",
    headline: "One record. Everything downstream inherits it.",
    description: "",
    cta: "Learn more",
    zones: [
      { tag: "big number", copy: "9" },
      { tag: "supporting line", copy: "systems to update when one record changes" },
      { tag: "resolution + wordmark", copy: "Change it once.", small: true }
    ]
  },
  {
    id: "C3",
    label: "Insider practice · document ad, page 1 of 9 · exec buyer, solution-aware",
    ratio: "4:5",
    imageMode: "wireframe",
    intro: "The nine questions your team gets asked most, and where each answer actually lives. Nine pages, no form.",
    headline: "Where the answers live",
    description: "",
    cta: "Download",
    zones: [
      { tag: "cover title", copy: "Where the answers live" },
      { tag: "subtitle", copy: "Nine questions, and the system that should have answered them" },
      { tag: "page count + wordmark", copy: "9 pages · no form", small: true }
    ]
  }
];

// ---------------------------------------------------------------------------
// EDIT ABOVE
// ---------------------------------------------------------------------------

const LIMITS = { intro: 150, introMax: 600, headline: 70, description: 100 };
const RATIOS = { "1:1": 100, "1.91:1": 52.36, "4:5": 125, "9:16": 177.78 };

const esc = s => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function countRow(name, value, limit, note) {
  if (value == null || value === "") return "";
  const n = value.length;
  const over = n > limit;
  const cls = over ? "over" : "ok";
  const mark = over ? "OVER" : "ok";
  return `<div>${esc(name)}: <span class="${cls}">${n} / ${limit} ${mark}</span>${note ? " " + esc(note) : ""}</div>`;
}

function renderIntro(text) {
  const visible = text.slice(0, LIMITS.intro);
  const rest = text.slice(LIMITS.intro);
  if (!rest) return esc(visible);
  return esc(visible) +
    `<span class="rest">${esc(rest)}</span>` +
    `<span class="seemore" onclick="this.parentNode.classList.add('open')">… see more</span>`;
}

function renderMedia(c) {
  if (c.imageMode === "image" && c.imageSrc) {
    return `<div class="media"><img src="${esc(c.imageSrc)}" alt="${esc(c.id)} render"></div>`;
  }
  const pad = RATIOS[c.ratio] || 100;
  const zones = (c.zones || []).map(z => `
      <div class="zone${z.small ? " sm" : ""}">
        <div class="tag">${esc(z.tag)}</div>
        <div class="copy">${esc(z.copy)}</div>
      </div>`).join("");
  return `<div class="media"><div class="ratio" style="padding-top:${pad}%">
      <div class="zones">${zones}</div>
    </div></div>`;
}

document.getElementById("grid").innerHTML = CONCEPTS.map(c => `
  <div class="concept">
    <div class="label"><b>${esc(c.id)}</b> · ${esc(c.label)} · ${esc(c.ratio)}</div>
    <div class="card">
      <div class="head">
        <div class="avatar">logo</div>
        <div class="who">
          <div class="name">${esc(ADVERTISER.name)}</div>
          <div class="sub">${esc(ADVERTISER.sub)}</div>
        </div>
      </div>
      <div class="intro">${renderIntro(c.intro || "")}</div>
      ${renderMedia(c)}
      <div class="foot">
        <div class="h">${esc(c.headline || "")}
          ${c.description ? `<div class="d">${esc(c.description)}</div>` : ""}
        </div>
        ${c.cta ? `<div class="cta">${esc(c.cta)}</div>` : ""}
      </div>
    </div>
    <div class="counts">
      ${countRow("intro, visible", (c.intro || "").slice(0, LIMITS.intro), LIMITS.intro, "before the fold")}
      ${countRow("intro, total", c.intro, LIMITS.introMax)}
      ${countRow("headline", c.headline, LIMITS.headline)}
      ${countRow("description", c.description, LIMITS.description)}
    </div>
  </div>
`).join("");
</script>
</body>
</html>
